[pytest]
# Собираем тесты ТОЛЬКО из каталога tests/.
# Иначе pytest по умолчанию обходит всё дерево и цепляет как "тесты"
# обычные функции services/*.py с именами на test_* (например
# test_to_detail в services/test_service.py), а также модели/схемы
# с именами Test* (models/test.py, schemas/test.py).
testpaths = tests
python_files = test_*.py
python_classes = Test*Tests
python_functions = test_*
