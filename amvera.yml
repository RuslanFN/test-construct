meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Единый контейнер: nginx отдаёт фронт и проксирует /api на uvicorn
  containerPort: 80
  # Персистентное хранилище (для логов/файлов)
  persistenceMount: /data

# Переменные окружения задаются в панели Amvera → «Переменные»:
#   mongo_host, mongo_port, mongo_username, mongo_password, mongo_db_name,
#   jwt_secret (>=32 символов), admin_username, admin_email, admin_password,
#   cookie_secure=true, cookie_samesite=strict, log_level=INFO
# Секреты (jwt_secret, admin_password, mongo_password) — с галочкой «Секрет».
