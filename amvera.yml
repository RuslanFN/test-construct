meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  docker:
    dockerfile: Dockerfile
    context: .

run:
  # Единый контейнер: nginx отдаёт фронт и проксирует /api на uvicorn
  containerPort: 80
  # Персистентное хранилище (если понадобится для логов/файлов)
  persistenceMount: /data

# Переменные окружения (mongo_host, mongo_username, mongo_password,
# mongo_db_name, jwt_secret, admin_*, cookie_*, ...) задаются
# в панели Amvera → «Переменные». Секреты — с галочкой «Секрет».
