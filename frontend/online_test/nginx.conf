# Зоны лимитов (счётчики nginx в памяти; конфиг — для docker-compose).
# IP клиента берём из заголовка доверенного прокси (см. docker/nginx.conf):
#   Amvera/Envoy -> X-Envoy-External-Address; свой nginx -> X-Real-IP;
#   прямой доступ -> $remote_addr. Меняется в ОДНОМ map ниже.
map $http_x_envoy_external_address $client_ip {
    default $http_x_envoy_external_address;
    ""      $remote_addr;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $client_ip zone=auth_zone:10m rate=30r/m;
limit_req_zone $client_ip zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит на размер тела запроса (экспорт/импорт, запас)
    client_max_body_size 10m;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_req_status 429;
    error_page 429 = @too_many;

    # Авторизация — самый грубый лимит (логин/регистрация)
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Проксирование API на backend-контейнер (имя сервиса из compose)
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # SPA: всё остальное отдаём index.html (hash-history роутинг)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON-ответ на срабатывание лимита (клиент всегда ждёт JSON, не HTML)
    location @too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Слишком много запросов. Подождите немного и повторите."}';
    }

    # Кэширование статических ассетов
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

