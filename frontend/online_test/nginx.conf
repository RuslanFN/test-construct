# Зоны лимитов (счётчики nginx в памяти; конфиг — для docker-compose).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит на размер тела запроса (экспорт/импорт, запас)
    client_max_body_size 10m;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Авторизация — самый грубый лимит (логин/регистрация)
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Проксирование API на backend-контейнер (имя сервиса из compose)
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: всё остальное отдаём index.html (hash-history роутинг)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
