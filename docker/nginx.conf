# Зоны лимитов (счётчики в памяти nginx; проект в одном контейнере).
# rate=...r/s: опираемся на $binary_remote_addr, чтобы грубый флуд
# отсекался на уровне прокси ещё до Python-приложения.
#
# ВАЖНО (Amvera): TLS и первый прокси — на стороне платформы. Чтобы
# $remote_addr стал реальным IP клиента, раскомментируйте блок real_ip
# ниже и впишите CIDR балансировщика Amvera (уточнить в документации/поддержке).
# Без этого limit_req будет считать всех клиентов как один IP (адрес балансировщика).
#
# set_real_ip_from 10.0.0.0/8;   # <-- CIDR балансировщика Amvera
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Авторизация (логин/регистрация) — самый грубый лимит.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ЗАМЕНЯЕМ, а не дописываем: приложению уходит один вычисленный адрес,
        # клиентские значения X-Forwarded-For не проходят (анти-подделка).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API проксируется на backend в ТОМ ЖЕ контейнере
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: hash-history роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

