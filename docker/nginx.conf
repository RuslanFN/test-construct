# Зоны лимитов (счётчики в памяти nginx; проект в одном контейнере).
#
# ОПРЕДЕЛЕНИЕ IP КЛИЕНТА — настраивается под площадку (ОДНО место).
# $remote_addr здесь = TCP-сокет. Если перед nginx есть прокси, это адрес
# прокси, а не клиента. Выбираем заголовок доверенного прокси в $client_ip:
#
#   AMVERA / Envoy (текущая площадка): X-Envoy-External-Address
#     (Envoy ставит и перезаписывает клиентский вариант — проверено).
#   Свой nginx с real_ip:             X-Real-IP
#   Прокси, чистящий XFF:             X-Forwarded-For (последний адрес)
#   Прямой доступ без прокси:         $binary_remote_addr (= $remote_addr)
#
# Ниже — вариант Amvera. При переезде раскомментируй/замени ОДИН map.
map $http_x_envoy_external_address $client_ip {
    default $http_x_envoy_external_address;
    ""      $remote_addr;   # прокси не прислал — не доверяем, берём сокет
}
# map $http_x_real_ip $client_ip {
#     default $http_x_real_ip;
#     ""      $remote_addr;
# }
# map $http_x_forwarded_for $client_ip {
#     "~^(.*?),\s*(.*)$" $2;   # последний адрес
#     default            $http_x_forwarded_for;
#     ""                 $remote_addr;
# }

# Внешняя схема (для X-Forwarded-Proto): если прокси сообщил — сохраняем, иначе $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $client_ip zone=auth_zone:10m rate=10r/m;
limit_req_zone $client_ip zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Авторизация (логин/регистрация) — самый грубый лимит.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложению уходит IP клиента (одно значение, рассчитано выше).
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # API проксируется на backend в ТОМ ЖЕ контейнере
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # SPA: hash-history роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

