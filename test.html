<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>HTML5</title>
    <!--[if IE]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <style>
        article,
        aside,
        details,
        figcaption,
        figure,
        footer,
        header,
        hgroup,
        menu,
        nav,
        section {
            display: block;
        }
    </style>
</head>

<body>
    <label for="question">Форма ответа:</label>
    <select id="question-type">
        <option>один правильный</option>
        <option>несколько правильных</option>
        <option>сопоставление</option>
        <option>текст</option>
    </select>
    <button id="add">Добавить</button>
    <script>
        const quetions = [];
        let counter = 0;
        document.getElementById("add").addEventListener("click", function () {
            counter++;
            let questionType = document.getElementById("question-type").value;
            quetions.push({ id: counter, type: questionType });
            if (questionType === "один правильный") {
                console.log("Выбран тип вопроса: один правильный");
                addQuestionAndAnswereList(counter, questionType);
            } else if (questionType === "несколько правильных") {
                console.log("Выбран тип вопроса: несколько правильных");
                addQuestionAndAnswereList(counter, questionType);
            } else if (questionType === "сопоставление") {
                console.log("Выбран тип вопроса: сопоставление");
                addQuestionAndAnswereList(counter, questionType)
            } else if (questionType === "текст") {
                // Здесь можно добавить код для обработки текстового вопроса
            }
            // Здесь можно добавить код для обработки выбранного типа вопроса

        });
        function addQuestionAndAnswereList(counter, questionType) {
            question = document.getElementById("quetion-template").content.cloneNode(true);
            questionInput = question.getElementById("question-text");
            questionInput.id = "question-" + String(counter);
            list = document.getElementById("list-answere-template").content.cloneNode(true);
            listContainer = list.querySelector(".answere-list-conainer")
            list.getElementById("add-ans").id = "add-ans-" + String(counter);
            listContainer.id = "answere-list-" + String(counter);
            console.log(list.id);
            document.body.appendChild(question);
            document.body.appendChild(list);
        };
        // Добавляет вариант ответа и идентифицирует каждую запись через id
        function addAnswer(id, parentId) {
            let buttonId = parseInt(id.replace('add-ans-', ''));
            button = document.getElementById(id);
            console.log(id)
            typeAnswere = quetions.find(q => q.id === buttonId).type;
            if (typeAnswere === "один правильный") {
                answere = document.getElementById("one-ccorrect-ans-template").content.cloneNode(true);
                radio = answere.getElementById('is-correct')
                radio.id = "is-correct-" + String(buttonId);
                radio.name = "is-correct-" + String(buttonId);
                document.getElementById(parentId).insertBefore(answere, button);
            } else if (typeAnswere === "несколько правильных") {
                answere = document.getElementById("some-ccorrect-ans-template").content.cloneNode(true);
                document.getElementById(parentId).insertBefore(answere, button);
            } else if (typeAnswere === "сопоставление") {
                answere = document.getElementById("match-ans-template").content.cloneNode(true);
                document.getElementById(parentId).insertBefore(answere, button);
            }
        };
    </script>
</body>
<template id="quetion-template">
    <div class="quetion-container">
        <label for="quetion-text"> Введите текст вопроса:</label>
        <input type="text" id="question-text" name="question-text" />
    </div>
</template>
<template id="list-answere-template">
    <div class="answere-list-conainer">
        <button id="add-ans" onclick="addAnswer(this.id, this.parentElement.id)">добавить вариант ответа</button>
    </div>
</template>
<template id="one-ccorrect-ans-template">
    <div class="one-correct-ans-container">
        <label for="answere"> Ответ</label>
        <input type="text" id="answere" name="answere" />
        <input type="radio" id="is-correct" name="is-correct" />
    </div>
</template>
<template id="some-ccorrect-ans-template">
    <div class="one-correct-ans-container">
        <label for="answere"> Ответ</label>
        <input type="text" id="answere" name="answere" />
        <input type="checkbox" name="is-correct" />
    </div>
</template>
<template id="match-ans-template">
    <div class="match-ans-container">
        <label for="answere-1">определение 1</label>
        <input type="text" id="answere" name="answere-1" />
        <label for="answere-2">определение 2</label>
        <input type="text" id="answere" name="answere-2" />
    </div>
</template>

</html>
